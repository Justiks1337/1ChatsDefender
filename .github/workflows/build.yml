name: build

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: pip install flake8
      - run: flake8 .

  unittest:
    runs-on: ubuntu-latest
    needs: flake8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: pip install -r requirements.txt
      - run: python3 -W ignore -m unittest discover tests "*_tests.py"


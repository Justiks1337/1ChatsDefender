name: deploy

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create env files
        env:
          BOT_TOKEN: ${{secrets.BOT_TOKEN}}
          GIGACHAT_API_AUTHORIZATION: ${{secrets.GIGACHAT_API_AUTHORIZATION}}
          RQUID: ${{secrets.GIGACHAT_RQUID}}
        run: |
          echo "GIGACHAT_API_AUTHORIZATION=$GIGACHAT_API_AUTHORIZATION" >> .env.gigachat"
          echo "RQUID=$RQUID" >> .env.gigachat
          echo "BOT_TOKEN=$BOT_TOKEN" >> .env.telegram

      - name: Copy archive
        run: |
          zip -r 1chatsdefender.zip .
          ls -lh *.zip
          install -Dm 400 <(echo "$SSH_KNOWN_HOSTS") ~/.ssh/known_hosts
          install -Dm 400 <(echo "$SSH_DEPLOY_KEY") deploy_key
          scp -i deploy_key -P "$SSH_DEPLOY_PORT" 1chatsdefender.zip "$SSH_DEPLOY_TARGET"
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{secrets.SSH_KNOWN_HOSTS}}
          SSH_DEPLOY_KEY: ${{secrets.SSH_PRIVATE_KEY}}
          SSH_DEPLOY_PORT: ${{secrets.SSH_DEPLOY_PORT}}
          SSH_DEPLOY_TARGET: ${{secrets.SSH_DEPLOY_TARGET}}

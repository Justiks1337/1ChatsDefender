name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6

      - name: Create env files
        env:
          BOT_TOKEN: ${{secrets.BOT_TOKEN}}
        run: |
          echo "BOT_TOKEN=$BOT_TOKEN" >> .env.telegram

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          since_last_remote_commit: true
          separator: ","

      - name: Copy files via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{secrets.SSH_HOST}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          port: ${{secrets.SSH_DEPLOY_PORT}}
          username: ${{secrets.SSH_USER}}
          proxy_host: ${{secrets.VPN_HOST}}
          proxy_port: ${{secrets.VPN_PORT}}
          proxy_key: ${{secrets.VPN_PRIVATE_KEY}}
          proxy_username: ${{secrets.VPN_USER}}
          source: ${{ steps.changed-files.outputs.all_changed_files }}
          target: ${{ vars.DEPLOY_PATH }}

      - name: Unpack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.SSH_HOST}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          port: ${{secrets.SSH_DEPLOY_PORT}}
          username: ${{secrets.SSH_USER}}
          proxy_host: ${{secrets.VPN_HOST}}
          proxy_port: ${{secrets.VPN_PORT}}
          proxy_key: ${{secrets.VPN_PRIVATE_KEY}}
          proxy_username: ${{secrets.VPN_USER}}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH }}
            python3.13 -m venv venv
            venv/bin/python3 -m pip install -r requirements.txt
            sudo systemctl restart 1chatsdefender

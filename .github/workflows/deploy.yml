name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create env files
        env:
          BOT_TOKEN: ${{secrets.BOT_TOKEN}}
        run: |
          echo "BOT_TOKEN=$BOT_TOKEN" >> .env.telegram


      - name: Install sshuttle
        run: sudo apt-get update && sudo apt-get install -y sshuttle

      - name: Setup VPN SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          install -Dm 400 <(ssh-keyscan -H ${{ secrets.VPN_HOST }}) ~/.ssh/known_hosts
          install -Dm 400 <(echo "${{ secrets.VPN_PRIVATE_KEY }}") ~/.ssh/vpn_id_rsa

      - name: Start VPN via sshuttle
        run: |
          nohup sshuttle -r ${{ secrets.VPN_USER }}@${{ secrets.VPN_HOST }}:${{ secrets.VPN_PORT }} \
            --ssh-cmd "ssh -i ~/.ssh/vpn_id_rsa" 0.0.0.0/0 &


      - name: Check public IP
        run: curl https://ifconfig.me

      - name: Copy archive
        run: |
          zip -r 1chatsdefender.zip .
          ls -lh *.zip
          install -Dm 400 <(echo "$SSH_KNOWN_HOSTS") ~/.ssh/known_hosts
          install -Dm 400 <(echo "$SSH_DEPLOY_KEY") deploy_key
          scp -i deploy_key -P "$SSH_DEPLOY_PORT" 1chatsdefender.zip "$SSH_USER@$SSH_HOST:$ARCHIVE_NAME"
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{secrets.SSH_KNOWN_HOSTS}}
          SSH_DEPLOY_KEY: ${{secrets.SSH_PRIVATE_KEY}}
          SSH_DEPLOY_PORT: ${{secrets.SSH_DEPLOY_PORT}}
          SSH_USER: ${{secrets.SSH_USER}}
          SSH_HOST: ${{secrets.SSH_HOST}}
          ARCHIVE_NAME: ${{vars.ARCHIVE_NAME}}

      - name: Unpack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.SSH_HOST}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          port: ${{secrets.SSH_DEPLOY_PORT}}
          username: ${{secrets.SSH_USER}}
          script: |
            set -e
            rm -rf ${{ vars.DEPLOY_PATH }}
            mkdir ${{ vars.DEPLOY_PATH }}
            mv ${{ vars.ARCHIVE_NAME }} ${{ vars.DEPLOY_PATH }}
            cd ${{ vars.DEPLOY_PATH }}
            unzip ${{ vars.ARCHIVE_NAME }}
            python3 -m venv venv
            venv/bin/python3 -m pip install -r requirements.txt 
            sudo systemctl restart 1chatsdefender
